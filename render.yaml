services:
  - type: web
    name: movierecapai-server
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: MOVIERECAP_API_KEY
        sync: false
      - key: MAX_UPLOAD_MB
        value: "2048"
      - key: JOB_TTL_HOURS
        value: "6"
